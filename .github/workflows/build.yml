name: build-mod

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 21

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.10.2"

  - name: Extract source ZIP
    run: |
      mkdir -p extracted
      ZIP=$(find . -maxdepth 2 -type f -name "*.zip" -print -quit)

      if [ -z "$ZIP" ]; then
        echo "ERROR: No ZIP file found"
        exit 1
      fi

      echo "Found ZIP: $ZIP"
      unzip -q -o "$ZIP" -d extracted

  - name: Build Fabric mod
    run: |
      BUILD_FILE=$(find extracted -type f -name "build.gradle" -print -quit)

      if [ -z "$BUILD_FILE" ]; then
        echo "ERROR: build.gradle not found inside ZIP"
        find extracted -maxdepth 4 -type f
        exit 1
      fi

      PROJECT_DIR=$(dirname "$BUILD_FILE")
      echo "Building: $PROJECT_DIR"

      cd "$PROJECT_DIR"
      gradle build --no-daemon

  - name: Upload compiled JAR
    uses: actions/upload-artifact@v4
    with:
      name: himel-ai-companion-jar
      path: extracted/**/build/libs/*.jar
      if-no-files-found: error
